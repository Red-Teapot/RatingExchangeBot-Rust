[package]
name = "rating-exchange-bot"
version = "0.3.3"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
async-trait = "0.1.92"
dotenvy = "0.15.7"
envy = "0.4.2"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

time = "0.3.55"
regex = "1.13.1"
lazy-regex = "3.6.1"
deunicode = "1.6.2"
strum = { version = "0.28.0", features = ["derive"] }
bimap = "0.6.3"

tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal"] }

sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "sqlite",
    "migrate",
    "time",
    "macros",
] }

serenity = { version = "0.12.5", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "native_tls_backend",
    "cache",
] }
poise = "0.6.2"

indoc = "2.0.7"

[dev-dependencies]
test-log = { version = "0.2.21", default-features = false, features = [
    "trace",
] }
map-macro = "0.3.0"

[profile.dev.package.sqlx-macros]
opt-level = 3
